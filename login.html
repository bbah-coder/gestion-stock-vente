<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--SERVICE PROGRESSIVE WEB APP (PWA)-->
  <meta name="theme-color" content="#22c55e">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/image/icon-192.png">

  <title>Connexion</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/login.css">

  <!--Supabase-->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <!--DIXIE-->
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>

</head>

<body>

  <div class="login-page">

    <div class="login-box">

      <h1>🛍️ Boutique Manager</h1>
      <p class="subtitle">Connectez-vous à votre espace</p>
      <p id="error" class="login-error"></p>

      <div class="input-group">
        <input type="text" id="username" placeholder="👤 Utilisateur">
      </div>

      <div class="input-group">
        <input type="password" id="password" placeholder="Mot de passe">
      </div>

      <button id="loginBtn">Se connecter</button>

      <button id="initPassword" class="init-password">🔑 Mot de passe oublié ? </button>

      <div id="error" class="error"></div>

      <div id="resetPasswordForm" class="reset-password-form hidden">

        <h3>🔑 Initialisation du mot de passe</h3>

        <p class="reset-info">
          Renseignez les informations demandées pour réinitialiser votre mot de passe.
        </p>

        <div class="input-group">
          <label for="phone"> 📞 Téléphone principal du magasin </label>
          <input type="tel" id="resetPhone" placeholder="Téléphone principale du magasin">
        </div>
        <div class="input-group">
          <label for="subscription">📦 Formule d'abonnement</label>
          <input type="text" id="resetFormule" placeholder="Formule d'abonnement">
        </div>

        <div class="input-group">
          <label for="amount">💰 Montant de souscription (GNF)</label>
          <input type="number" id="resetAmount" placeholder="Montant de souscription (GNF)">
        </div>

        <div class="input-group">
          <label for="newPassword">🔒 Nouveau mot de passe</label>
          <input type="password" id="newPassword" placeholder="Nouveau mot de passe">
        </div>

        <div class="input-group">
          <label for="confirmPassword">🔒 Confirmer le mot de passe</label>
          <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe">
        </div>

        <button id="btnResetPassword" class="btn-reset"> Réinitialiser le mot de passe </button>

      </div>

      <!--<div class="info">
        <small>Admin : admin / 1234</small><br>
        <small>Vendeur : vendeur / 1234</small>
      </div>-->

    </div>

  </div>

  <div id="toast" class="toast"></div>

  <script src="js/utils.js"></script>
  <script src="js/login.js"></script>
  <!--DIXIE-->
  <script src="js/admin/indexdDB/database.js"></script>
  <script src="js/admin/models/profilesSupabase.js"></script>
  <script src="js/admin/models/productsSupabase.js"></script>
  <script src="js/admin/models/stockmvtSupabase.js"></script>
  <script src="js/admin/models/initData.js"></script>

</body>

</html>
